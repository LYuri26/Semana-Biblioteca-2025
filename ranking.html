<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking - BirdBox Game</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos/ranking.css">
</head>

<body>
    <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center py-4">
        <div class="ranking-container">
            <div class="text-center mb-4">
                <h1 class="ranking-title display-4 fw-bold mb-3">
                    🏆 Ranking de Jogadores
                </h1>
                <p class="ranking-subtitle text-light opacity-75">
                    Os melhores jogadores do BirdBox
                </p>
            </div>

            <div class="table-responsive">
                <table class="ranking-table table table-hover align-middle mb-0">
                    <thead class="ranking-header">
                        <tr>
                            <th class="text-center">#</th>
                            <th>Jogador</th>
                            <th class="text-center">Pontuação</th>
                        </tr>
                    </thead>
                    <tbody id="rankingBody">
                        <tr>
                            <td colspan="4" class="text-center py-4">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Carregando...</span>
                                </div>
                                <p class="mt-2 mb-0 text-light">Carregando ranking...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="actions mt-4">
                <button id="backMenu" class="btn-back btn btn-primary btn-lg px-4 py-2">
                    <i class="bi bi-arrow-left me-2"></i>
                    Voltar ao Menu
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <!-- Scripts -->
    <script src="scripts/firebase/config.js"></script>
    <script src="scripts/firebase/database.js"></script>
    <script src="scripts/ranking.js"></script>
</body>

</html>
