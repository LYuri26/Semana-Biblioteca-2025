<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking - BirdBox Game</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos/ranking.css">
</head>

<body>
    <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center py-4">
        <div class="ranking-container">
            <div class="text-center mb-4">
                <h1 class="ranking-title display-4 fw-bold mb-3">
                    🏆 Ranking de Duplas
                </h1>
                <p class="ranking-subtitle text-light opacity-75">
                    As melhores duplas do BirdBox - #SemanaDaBibliotecaSENAIUberaba
                </p>
            </div>

            <div class="table-responsive">
                <table class="ranking-table table table-hover align-middle mb-0">
                    <thead class="ranking-header">
                        <tr>
                            <th class="text-center">#</th>
                            <th>Dupla</th>
                            <th class="text-center">Pontuação</th>
                            <th class="text-center">Compartilhar</th>
                        </tr>
                    </thead>
                    <tbody id="rankingBody">
                        <tr>
                            <td colspan="4" class="text-center py-4">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Carregando...</span>
                                </div>
                                <p class="mt-2 mb-0 text-light">Carregando ranking...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="actions mt-4 text-center">
                <button id="backMenu" class="btn-back btn btn-primary btn-lg px-4 py-2 me-3">
                    <i class="bi bi-arrow-left me-2"></i>
                    Voltar ao Menu
                </button>

            </div>
        </div>
    </div>

    <!-- Modal de Compartilhamento -->
    <div id="shareModal" class="share-modal" style="display: none;">
        <div class="share-modal-content">
            <div class="share-modal-header">
                <h3>🎉 Compartilhar Conquista!</h3>
                <button class="share-close-btn" onclick="shareManager.closeModal()">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>

            <div class="share-preview-container">
                <div id="sharePreview" class="share-preview">
                    <!-- Preview da imagem será gerado aqui -->
                </div>
            </div>

            <div class="share-actions">
                <p class="share-instruction">Compartilhe nas redes sociais:</p>

                <div class="share-buttons-grid">
                    <button class="share-btn instagram" onclick="shareManager.shareToInstagram()">
                        <i class="bi bi-instagram"></i>
                        <span>Instagram</span>
                    </button>

                    <button class="share-btn tiktok" onclick="shareManager.shareToTikTok()">
                        <i class="bi bi-tiktok"></i>
                        <span>TikTok</span>
                    </button>

                    <button class="share-btn twitter" onclick="shareManager.shareToTwitter()">
                        <i class="bi bi-twitter-x"></i>
                        <span>Twitter/X</span>
                    </button>

                    <button class="share-btn facebook" onclick="shareManager.shareToFacebook()">
                        <i class="bi bi-facebook"></i>
                        <span>Facebook</span>
                    </button>

                    <button class="share-btn whatsapp" onclick="shareManager.shareToWhatsApp()">
                        <i class="bi bi-whatsapp"></i>
                        <span>WhatsApp</span>
                    </button>

                    <button class="share-btn download" onclick="downloadShareImage()">
                        <i class="bi bi-download"></i>
                        <span>Salvar Imagem</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <!-- Scripts -->
    <script src="scripts/firebase/config.js"></script>
    <script src="scripts/firebase/database.js"></script>
    <script src="scripts/ranking.js"></script>
    <script src="scripts/compartilhar.js"></script>
</body>

</html>
